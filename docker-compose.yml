services:
  postgres:
    # Mesma versão major usada na Railway (D35). Digest fixo; o Dependabot atualiza.
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    container_name: personal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: personal_ai
      POSTGRES_DB: personal_ai
    ports:
      # Só a própria máquina: não expõe o banco na rede local.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
