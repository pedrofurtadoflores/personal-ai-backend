name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: personal_ai
          POSTGRES_PASSWORD: personal_ai
          POSTGRES_DB: personal_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai -d personal_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://personal_ai:personal_ai@localhost:5432/personal_ai

    steps:
      # Actions fixadas por SHA (o Dependabot atualiza).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://personal_ai:personal_ai@localhost:5432/personal_ai_test
      - run: npm run build

      - name: Schema e migrations sincronizados
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "Schema mudou sem migration: rode npm run db:generate e faça commit."
            exit 1
          fi

      - name: Imagem Docker sobe, aplica as migrations e responde /health
        run: |
          docker build -t personal-ai-backend .
          docker run -d --name api --network host \
            -e HOST=127.0.0.1 -e PORT=3333 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e APP_PASSWORD_HASH='$2b$04$aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
            -e JWT_SECRET=segredo-so-para-o-smoke-test-da-ci-123456 \
            -e FRONTEND_URL=http://localhost:3000 \
            personal-ai-backend
          for i in $(seq 1 30); do
            if curl -fs localhost:3333/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
